# Environment used by Binder (the "run code on this page" button).
# Keep the pip list identical to ../requirements.txt; CI checks that they match.
name: flows
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
    - numpy==2.5.3
    - scipy==1.18.1
    - matplotlib==3.11.2
    - ipywidgets==8.1.9
    - pandas==3.1.1
    - jupyterlab>=4.0
    - ipykernel>=6.29
